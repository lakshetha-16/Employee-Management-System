{% extends "base.html" %}

{% block title %}Add Employee{% endblock %}

{% block content %}

<div class="dashboard">

    <!-- Sidebar -->
    <aside class="sidebar">

        <div class="logo">
            <i class="fa-solid fa-building"></i>
            <h2>EMS</h2>
        </div>

        <ul class="menu">
            <li>
                <a href="/" style="text-decoration:none;color:white;">
                    <i class="fa-solid fa-house"></i>
                    <span>Dashboard</span>
                </a>
            </li>

            <li class="active">
                <i class="fa-solid fa-user-plus"></i>
                <span>Add Employee</span>
            </li>
        </ul>

    </aside>

    <!-- Main Content -->
    <main class="main-content">

        <header class="topbar">
            <div>
                <h1>Add Employee</h1>
                <p>Enter employee details below.</p>
            </div>
        </header>

        <div class="table-section">

            <form method="POST">

                <div style="margin-bottom:20px;">
                    <label><b>Employee Name</b></label><br><br>
                    <input type="text" name="name" required
                    style="width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;">
                </div>

                <div style="margin-bottom:20px;">
                    <label><b>Department</b></label><br><br>
                    <input type="text" name="department" required
                    style="width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;">
                </div>

                <div style="margin-bottom:20px;">
                    <label><b>Position</b></label><br><br>
                    <input type="text" name="position" required
                    style="width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;">
                </div>

                <div style="margin-bottom:20px;">
                    <label><b>Salary</b></label><br><br>
                    <input type="number" name="salary" required
                    style="width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;">
                </div>

                <div style="margin-bottom:30px;">
                    <label><b>Status</b></label><br><br>

                    <select name="status"
                    style="width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;">

                        <option>Active</option>
                        <option>Inactive</option>

                    </select>

                </div>

                <button type="submit" class="toolbar button"
                style="background:#2563eb;color:white;padding:12px 25px;border:none;border-radius:8px;cursor:pointer;">

                    Save Employee

                </button>

                <a href="/"
                style="margin-left:15px;text-decoration:none;color:#2563eb;font-weight:bold;">

                    Cancel

                </a>

            </form>

        </div>

    </main>

</div>

{% endblock %}
